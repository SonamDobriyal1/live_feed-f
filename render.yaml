# Render Blueprint — headless violence monitor (no live feed UI)
# Docs: https://render.com/docs/background-workers
#
# Deploy: connect repo on Render → New Blueprint → select render.yaml
# Or: New → Background Worker → Docker → point to this repo

services:
  - type: worker
    name: violence-monitor
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Starter plan recommended for 24/7 CCTV monitoring (free tier sleeps)
    plan: starter
    region: singapore
    envVars:
      - key: DEPLOY_HEADLESS
        value: "true"
      - key: SMS_ENABLED
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"

      # --- Camera (set in Render Dashboard) ---
      - key: CAMERA_IP
        sync: false
      - key: CAMERA_USER
        sync: false
      - key: CAMERA_PASS
        sync: false
      - key: RTSP_PORT
        value: "554"
      - key: CAMERA_CHANNEL
        value: "1"
      - key: CAMERA_SUBTYPE
        value: "1"

      # --- Model tuning ---
      - key: VIOLENCE_CONF
        value: "0.60"
      - key: VIOLENCE_EVERY_N
        value: "3"
      - key: ALERT_COOLDOWN_SEC
        value: "10"

      # --- Twilio SMS (set secrets in Dashboard) ---
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: SMS_TO
        sync: false
      - key: TWILIO_SMS_TEMPLATE
        value: sms_internal_alerts
      - key: TWILIO_SMS_USE_TEMPLATE
        value: "true"

      # --- Optional Supabase logging ---
      - key: SUPABASE_LOGGING
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
